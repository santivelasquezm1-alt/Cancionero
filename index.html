const CH=/^(?:Sol|Do|Re|Mi|Fa|La|Si|[A-G])[#b]?(?:m|M|maj|min|dim|aug|sus|add|[+\-º°\d()#b])*(?:\/(?:Sol|Do|Re|Mi|Fa|La|Si|[A-G])[#b]?)?$/;
const SEC=/^\s*[\[(]?\s*(intro|verso|verse|coro|chorus|estribillo|puente|bridge|pre-?coro|pre-?chorus|outro|solo|interludio|final|instrumental|refr[aá]n)\b[^\])]*[\])]?:?\s*$/i;
const isCh=l=>{const t=l.trim().split(/\s+/);return t[0]!==''&&t.some(x=>CH.test(x))&&t.every(x=>CH.test(x)||/^[|:\-–.()x×\d%/]+$/i.test(x))};
function parseImport(raw,fn){let title='',artist='',key='',m;const out=[],L=raw.replace(/\r/g,'').replace(/\t/g,'    ').split('\n');
 for(let i=0;i<L.length;i++){const l=L[i];
  if((m=l.match(/^\{\s*(title|t|artist|a|subtitle|st|key)\s*:\s*(.*?)\s*\}$/i))){const k=m[1].toLowerCase();if(k=='title'||k=='t')title=m[2];else if(k=='key')key=m[2];else artist=m[2];continue}
  if((m=l.match(/^\{\s*(?:comment|c|ci)\s*:\s*(.*?)\s*\}$/i))){out.push('# '+m[1]);continue}
  if(/^\{\s*(start_of|so)/i.test(l)){const n=l.match(/:\s*(.*?)\s*\}/);out.push('# '+((n&&n[1])||(/chorus|soc/i.test(l)?'Coro':'Sección')));continue}
  if(/^\{.*\}$/.test(l))continue;
  if(SEC.test(l)&&!isCh(l)){out.push('# '+l.replace(/[\[\]()]/g,'').replace(/:\s*$/,'').trim());continue}
  if(isCh(l)){const nx=L[i+1];
   if(nx!==undefined&&nx.trim()&&!isCh(nx)&&!SEC.test(nx)&&!/^\{/.test(nx)&&!/\[[^\]]+\]/.test(nx)){let ly=nx;const ms=[...l.matchAll(/\S+/g)].filter(x=>CH.test(x[0]));
    const need=Math.max(...ms.map(x=>x.index))+1;if(ly.length<need)ly=ly.padEnd(need);
    for(let k=ms.length-1;k>=0;k--)ly=ly.slice(0,ms[k].index)+'['+ms[k][0]+']'+ly.slice(ms[k].index);
    out.push(ly.replace(/\s+$/,''));i++}
   else out.push(l.trim().split(/\s+/).filter(x=>CH.test(x)).map(x=>'['+x+']').join(' '));
   continue}
  out.push(l.replace(/\s+$/,''))}
 const text=out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
 if(!key){const f=text.match(/\[([^\]]+)\]/);if(f)key=f[1].split('/')[0]}

 return{id:uid(),title,artist,key:key||'C',text}}

document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.cell');if(!c||!V.sel||V.noClick||!V.edit||V.mode!='vis')return;snap();setChord(+c.dataset.l,+c.dataset.p,V.sel);pal();cv()});
function saveSong(){const s=V.edit;s.title=(s.title||'').trim()||'Sin título';s.u=Date.now();s.key=(s.key||'').trim()||'C';
 const i=S.songs.findIndex(x=>x.id==s.id);i<0?S.songs.push(s):S.songs[i]=s;save();V.isNew=false;V.shift=0;go({edit:null,song:s.id})}

function pdfOne(){const s=S.songs.find(x=>x.id==V.song);toPDF([{s,shift:V.shift-V.capo,capo:V.capo}],s.title)}
function pdfSet(){const c=cs();toPDF(c.ids.map(id=>({s:S.songs.find(x=>x.id==id),shift:0})).filter(x=>x.s),c.name)}
function delSong(){del(V.edit.id,true)}

function sets(hd,mn){const cur=V.set?S.sets.find(x=>x.id==V.set):null;
 if(!cur){hd.innerHTML=`<h1>Setlists</h1><button class="b p" onclick="newSet()">+ Nuevo</button>`;
  mn.innerHTML=S.sets.map(x=>`<div class="item" onclick="go({set:'${x.id}'})"><div class="t"><b>${esc(x.name)}</b><br><small>${x.ids.length} canciones</small></div></div>`).join('')||'<p class="mu">Crea un setlist para ordenar tu repertorio.</p>';return}
 hd.innerHTML=`<button class="b" onclick="go({set:null})">←</button><h1>${esc(cur.name)}</h1><button class="b" onclick="renSet()">✎</button><button class="b p" onclick="pdfSet()">📄 PDF</button><button class="b d" onclick="delSet()">🗑</button>`;
 mn.innerHTML=cur.ids.map((id,i)=>{const s=S.songs.find(x=>x.id==id);return s?`<div class="item"><div class="t" onclick="V.shift=0;V.capo=0;go({song:'${id}'})"><b>${i+1}. ${esc(s.title)}</b><br><small>${esc(s.artist||'')}</small></div>
  <button class="b" onclick="mv(${i},-1)">↑</button><button class="b" onclick="mv(${i},1)">↓</button><button class="b d" onclick="rm(${i})">✕</button></div>`:''}).join('')+
  `<label>Agregar canción</label><select onchange="addTo(this.value)"><option value="">Elegir…</option>${S.songs.filter(s=>!cur.ids.includes(s.id)).map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>`}
function newSet(){const n=prompt('Nombre del setlist');if(!n)return;const x={id:uid(),name:n,ids:[]};S.sets.push(x);save();go({set:x.id})}
function cs(){return S.sets.find(x=>x.id==V.set)}
function addTo(id){if(id){cs().ids.push(id);save();draw()}}
function rm(i){cs().ids.splice(i,1);save();draw()}
function mv(i,d){const a=cs().ids,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();draw()}
function delSet(){if(confirm('¿Eliminar setlist?')){S.sets=S.sets.filter(x=>x.id!=V.set);save();go({set:null})}}

function cfg(hd,mn){hd.innerHTML='<h1>Ajustes</h1>';
 mn.innerHTML=`<div class="pvc"><div class="song">${render('[Am]Hola [F]mundo [C]cruel, [G]vuelve a mí',0,'C')}</div></div>
 <label>Fuente de la letra</label>${fsel('fontSong',SONGF)}<label>Fuente de la interfaz</label>${fsel('fontUI',UIF)}
 <label>Interlineado: ${S.lh||1.4}</label><input type="range" min="1.1" max="2.2" step="0.1" value="${S.lh||1.4}" oninput="S.lh=+this.value;save();theme();this.previousElementSibling.textContent='Interlineado: '+S.lh">
 <label>Acordes</label><select onchange="S.cw=this.value;save();draw()"><option value="700" ${(S.cw||700)==700?'selected':''}>Negrita</option><option value="400" ${S.cw==400?'selected':''}>Normal</option></select>
 <label>Colores de acento (estilo Mac)</label><div class="sw">${ACC.map(c=>`<button class="${S.accent==c?'on':''}" style="background:${c};width:34px;height:34px;border-radius:50%" onclick="S.accent='${c}';save();draw()"></button>`).join('')}</div>
 <label>Tema de color</label><div class="sw">${THEMES.map(([k,n,c])=>`<button class="${S.theme==k?'on':''}" style="background:${c};color:${k=='claro'||k=='sepia'||k=='maclight'?'#222':'#fff'}" onclick="S.theme='${k}';save();draw()">${n}</button>`).join('')}</div>
 <label>Color de acento personalizado</label><div class="bar"><input type="color" style="width:70px;padding:2px" value="${S.accent||'#ffb020'}" onchange="S.accent=this.value;save();draw()"><button class="b" onclick="S.accent='';save();draw()">Restablecer</button></div>
 <label>Notación de acordes</label><select onchange="S.notation=this.value;save();draw()"><option value="ABC" ${S.notation=='ABC'?'selected':''}>Americana (C D E F G A B)</option><option value="LAT" ${S.notation=='LAT'?'selected':''}>Latina (Do Re Mi Fa Sol La Si)</option></select>
 <label>Tamaño de letra: ${S.fs}px</label><input type="range" min="12" max="36" value="${S.fs}" oninput="S.fs=+this.value;save();theme()">
 ${pedalUI()}${a11yUI()}<label>Papelera (${(S.bin||[]).length})</label>${(S.bin||[]).map(x=>`<div class="item"><div class="t">${esc(x.title)}</div><button class="b" onclick="restore('${x.id}')">Restaurar</button><button class="b d" onclick="purge('${x.id}')">✕</button></div>`).join('')||'<p class="mu">Vacía. Lo que elimines puede recuperarse aquí.</p>'}
 <label>Respaldo</label><div class="bar"><button class="b" onclick="toPDF(S.songs.map(s=>({s,shift:0})),'Cancionero completo')">📄 PDF de todo el cancionero</button></div><div class="bar"><button class="b" onclick="exp()">⬇ Exportar JSON</button><label class="b" style="margin:0;color:var(--tx)">⬆ Importar<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div>
 <div class="bar"><button class="b" onclick="loadRepo()">🔄 Cargar songs.json del repositorio</button></div>
 <p class="mu">Tus canciones se guardan automáticamente en este navegador (en dos lugares a la vez, y se pide almacenamiento persistente). Para no perderlas nunca: exporta un respaldo de vez en cuando y, si quieres, sube ese archivo a tu repositorio con el nombre <b>songs.json</b>; la app lo carga sola en un dispositivo nuevo.${S.lastBackup?'<br>Último respaldo: '+new Date(S.lastBackup).toLocaleString():''}</p>`}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{merge(JSON.parse(r.result));alert('Respaldo importado')}catch(e){alert('Archivo inválido')}};r.readAsText(f)}
draw();icons();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
DB.get().then(j=>{if(j){const d=JSON.parse(j);if((d.ts||0)>(S.ts||0)){S={...S,...d};draw()}}else if(!S.ts)loadRepo(true)});
</script></body></html>
