<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171923">
  <title>Mi Cancionero</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171923;
      --card: #222633;
      --text: #f4f5f8;
      --muted: #a6adbb;
      --accent: #f4b942;
      --border: #363d4d;
      --song-font: monospace;
      --song-size: 18px;
      --song-columns: 1;
    }
    [data-theme="claro"] {
      color-scheme: light;
      --bg: #f4f5f7; --card: #fff; --text: #20232b;
      --muted: #626976; --accent: #1769aa; --border: #d9dde5;
    }
    [data-theme="sepia"] {
      color-scheme: light;
      --bg: #f1e6cf; --card: #faf3e5; --text: #382e20;
      --muted: #77694f; --accent: #984d1d; --border: #d7c6a4;
    }
    [data-theme="bosque"] {
      color-scheme: dark;
      --bg: #12221b; --card: #1c3328; --text: #e8f4eb;
      --muted: #a2bdac; --accent: #60cf87; --border: #315340;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, sans-serif;
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    header {
      position: sticky; top: 0; z-index: 3; display: flex; align-items: center;
      gap: 8px; padding: 12px; background: var(--bg);
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0 auto 0 0; font-size: 19px; }
    main { width: min(900px, 100%); margin: auto; padding: 16px; padding-bottom: 90px; }
    nav {
      position: fixed; z-index: 4; bottom: 0; left: 0; right: 0;
      display: flex; padding-bottom: env(safe-area-inset-bottom);
      background: var(--card); border-top: 1px solid var(--border);
    }
    nav button { flex: 1; padding: 12px 4px; border: 0; background: none; color: var(--muted); }
    nav button.active { color: var(--accent); font-weight: 700; }
    .button {
      border: 1px solid var(--border); border-radius: 9px;
      padding: 8px 11px; color: var(--text); background: var(--card);
    }
    .primary { color: #171923; background: var(--accent); border-color: var(--accent); font-weight: 700; }
    .danger { color: #ff7878; }
    input, textarea, select {
      width: 100%; padding: 10px; border: 1px solid var(--border);
      border-radius: 9px; background: var(--card); color: var(--text);
    }
    textarea { min-height: 260px; resize: vertical; }
    label { display: block; margin: 14px 0 5px; color: var(--muted); font-size: 14px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 12px 0; }
    .toolbar input[type="search"] { flex: 1; min-width: 180px; }
    .card, .song-item {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px; margin: 9px 0;
    }
    .song-item { display: flex; align-items: center; gap: 10px; }
    .song-item .info { flex: 1; min-width: 0; cursor: pointer; }
    .muted, small { color: var(--muted); }
    .pill {
      display: inline-block; padding: 2px 9px; border-radius: 20px;
      color: #171923; background: var(--accent); font-weight: 700; font-size: 13px;
    }
    .library-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(210px,1fr)); gap: 10px; }
    .library-card { cursor: pointer; min-height: 115px; }
    .library-card h3 { margin: 5px 0; }
    .song {
      font-family: var(--song-font); font-size: var(--song-size);
      line-height: 1.85; column-count: var(--song-columns);
      column-gap: 2.5rem; column-rule: 1px solid var(--border);
      overflow-wrap: anywhere;
    }
    .line { white-space: pre-wrap; break-inside: avoid; }
    .section {
      color: var(--accent); font: 700 .9em/1.4 system-ui,sans-serif;
      text-transform: uppercase; margin: 1.2em 0 .3em; break-after: avoid;
    }
    .chord { color: var(--accent); font-weight: 800; }
    .empty { padding: 25px 10px; text-align: center; color: var(--muted); }
    .back { margin-right: 3px; }
    .check { width: auto; }
    @media (max-width: 620px) {
      .row { grid-template-columns: 1fr; }
      .song { column-count: 1 !important; }
      main { padding: 11px; }
      header h1 { font-size: 17px; }
      nav button { font-size: 12px; }
    }
    @media print {
      header, nav, .no-print { display: none !important; }
      body { background: white; color: black; }
      main { width: 100%; padding: 0; }
      .song { color: black; }
    }
  </style>
</head>
<body>
  <header id="header"></header>
  <main id="app"></main>
  <nav id="nav"></nav>

<script>
'use strict';

const STORAGE_KEY = 'mi-cancionero-v1';
const demo = {
  id: 'demo-1',
  title: 'Vuelve a mí (ejemplo)',
  artist: 'Ejemplo',
  key: 'C',
  favorite: false,
  text: '# Verso\n[C]Cuando el sol se [G]va, la noche [Am]llega sin [F]avisar\n[C]Y tu voz me [G]dice que es hora de [F]volver [G]\n# Coro\n[F]Vuelve a mí, [C]vuelve a mí\n[G]Que sin ti no [Am]sé vivir [F/A]'
};

let data = { songs: [], folders: [], theme: 'oscuro', font: 'mono', columns: 1, size: 18 };
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
  if (saved) data = { ...data, ...saved };
} catch (_) {}
if (!Array.isArray(data.songs)) data.songs = [];
if (!Array.isArray(data.folders)) data.folders = [];
if (!data.songs.length) data.songs.push(demo);

let page = 'songs';
let currentSong = null;
let currentFolder = null;
let editingId = null;
let searchText = '';
let onlyFavorites = false;
let semitones = 0;

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
  catch (_) { alert('No se pudo guardar. Exporta un respaldo y libera espacio del navegador.'); }
}
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}
function id() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function getSong(songId) { return data.songs.find(s => s.id === songId); }
function setTheme() {
  document.documentElement.dataset.theme = data.theme === 'oscuro' ? '' : data.theme;
  const root = document.documentElement.style;
  root.setProperty('--song-size', `${data.size}px`);
  root.setProperty('--song-columns', String(data.columns));
  root.setProperty('--song-font', data.font === 'serif'
    ? 'Georgia, "Times New Roman", serif'
    : data.font === 'sans' ? 'Arial, Helvetica, sans-serif' : 'ui-monospace, Menlo, monospace');
}
function go(next) {
  page = next; currentSong = null; currentFolder = null; editingId = null; draw();
}
function draw() {
  setTheme();
  const navItems = [
    ['songs','🎵 Canciones'], ['library','📚 Biblioteca'], ['settings','⚙️ Ajustes']
  ];
  document.getElementById('nav').innerHTML = navItems.map(([key,label]) =>
    `<button class="${page===key?'active':''}" onclick="go('${key}')">${label}</button>`
  ).join('');

  if (editingId !== null) return drawEditor();
  if (currentSong) return drawViewer();
  if (page === 'library') return drawLibrary();
  if (page === 'settings') return drawSettings();
  drawSongs();
}
function drawSongs() {
  document.getElementById('header').innerHTML =
    `<h1>Mi Cancionero</h1><button class="button primary" onclick="newSong()">＋ Nueva</button>`;
  const filtered = data.songs.filter(s =>
    (!onlyFavorites || s.favorite) &&
    `${s.title} ${s.artist||''}`.toLowerCase().includes(searchText.toLowerCase())
  ).sort((a,b) => a.title.localeCompare(b.title, 'es'));
  document.getElementById('app').innerHTML = `
    <div class="toolbar">
      <input type="search" placeholder="Buscar canción o artista…" value="${escapeHTML(searchText)}"
        oninput="searchText=this.value;drawSongs()">
      <button class="button ${onlyFavorites?'primary':''}" onclick="onlyFavorites=!onlyFavorites;drawSongs()">⭐ Favoritas</button>
    </div>
    <p class="muted">${data.songs.length} canciones</p>
    ${filtered.map(s => `
      <div class="song-item">
        <div class="info" onclick="openSong('${s.id}')">
          <b>${escapeHTML(s.title || 'Sin título')}</b><br><small>${escapeHTML(s.artist || '')}</small>
        </div>
        <span class="pill">${escapeHTML(s.key || 'C')}</span>
        <button class="button" aria-label="Favorito" onclick="toggleFavorite('${s.id}')">${s.favorite?'⭐':'☆'}</button>
        <button class="button danger" aria-label="Eliminar" onclick="deleteSong('${s.id}')">🗑</button>
      </div>`).join('') || '<div class="empty">No hay canciones que coincidan con la búsqueda.</div>'}
    <p class="muted">Consejo: guarda copias de seguridad desde Ajustes para no perder tus canciones.</p>`;
}
function openSong(songId) { currentSong = songId; semitones = 0; draw(); }
function toggleFavorite(songId) {
  const s = getSong(songId); if (!s) return;
  s.favorite = !s.favorite; save(); drawSongs();
}
function deleteSong(songId) {
  const s = getSong(songId); if (!s) return;
  if (!confirm(`¿Eliminar “${s.title}”?`)) return;
  data.songs = data.songs.filter(x => x.id !== songId);
  data.folders.forEach(f => f.ids = f.ids.filter(x => x !== songId));
  save(); drawSongs();
}
function newSong() {
  const s = { id:id(), title:'', artist:'', key:'C', favorite:false, text:'# Verso\\n' };
  data.songs.push(s); save(); editingId = s.id; draw();
}
function drawEditor() {
  const s = getSong(editingId);
  if (!s) { editingId = null; draw(); return; }
  document.getElementById('header').innerHTML =
    `<button class="button" onclick="editingId=null;draw()">←</button><h1>Editar canción</h1>
     <button class="button primary" onclick="saveEditor()">Guardar</button>`;
  document.getElementById('app').innerHTML = `
    <label>Título</label><input id="title" value="${escapeHTML(s.title)}">
    <div class="row">
      <div><label>Artista</label><input id="artist" value="${escapeHTML(s.artist)}"></div>
      <div><label>Tono original</label><input id="key" value="${escapeHTML(s.key)}" placeholder="C, Am, F…"></div>
    </div>
    <label>Letra y acordes</label>
    <p class="muted">Escribe los acordes entre corchetes, por ejemplo: [C]Hola, [G]¿cómo estás? Las líneas que empiezan con # son secciones.</p>
    <textarea id="text" spellcheck="false">${escapeHTML(s.text)}</textarea>
    <div class="toolbar"><button class="button primary" onclick="saveEditor()">Guardar canción</button>
    <button class="button" onclick="previewSong()">Vista previa</button></div>`;
}
function saveEditor() {
  const s = getSong(editingId); if (!s) return;
  s.title = document.getElementById('title').value.trim() || 'Sin título';
  s.artist = document.getElementById('artist').value.trim();
  s.key = document.getElementById('key').value.trim() || 'C';
  s.text = document.getElementById('text').value;
  save(); editingId = null; page = 'songs'; draw();
}
function previewSong() {
  const s = getSong(editingId); if (!s) return;
  s.title = document.getElementById('title').value.trim() || 'Sin título';
  s.artist = document.getElementById('artist').value.trim();
  s.key = document.getElementById('key').value.trim() || 'C';
  s.text = document.getElementById('text').value;
  save(); editingId = null; currentSong = s.id; draw();
}
const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function transposeChord(chord, steps) {
  return chord.replace(/(^|\/)([A-G])([#b]?)/g, (whole, slash, note, accidental) => {
    let n = NOTES.indexOf(note);
    if (accidental === '#') n++;
    if (accidental === 'b') n--;
    return slash + NOTES[((n + steps) % 12 + 12) % 12];
  });
}
function renderSong(text, shift) {
  return String(text || '').split('\n').map(line => {
    if (/^#/.test(line)) return `<div class="section">${escapeHTML(line.replace(/^#\s*/,''))}</div>`;
    const safe = escapeHTML(line).replace(/\[([^\]]+)\]/g, (_, chord) =>
      `<span class="chord">[${escapeHTML(transposeChord(chord, shift))}]</span>`
    );
    return `<div class="line">${safe || '&nbsp;'}</div>`;
  }).join('');
}
function drawViewer() {
  const s = getSong(currentSong);
  if (!s) { currentSong = null; draw(); return; }
  document.getElementById('header').innerHTML =
    `<button class="button" onclick="currentSong=null;draw()">←</button>
     <h1>${escapeHTML(s.title)}</h1>
     <button class="button" onclick="toggleFavorite('${s.id}')">${s.favorite?'⭐':'☆'}</button>
     <button class="button" onclick="window.print()">🖨️</button>
     <button class="button" onclick="editingId='${s.id}';draw()">✎</button>`;
  document.getElementById('app').innerHTML = `
    <p class="muted">${escapeHTML(s.artist || '')}</p>
    <div class="toolbar no-print">
      <span>Tono:</span><button class="button" onclick="changeKey(-1)">−½</button>
      <span class="pill">${escapeHTML(transposeChord(s.key || 'C', semitones))}</span>
      <button class="button" onclick="changeKey(1)">+½</button>
      <button class="button" onclick="semitones=0;draw()">Original</button>
      <button class="button" onclick="data.columns=data.columns===1?2:1;save();draw()">📖 ${data.columns} columna(s)</button>
    </div>
    <div class="song">${renderSong(s.text, semitones)}</div>`;
}
function changeKey(amount) { semitones = (semitones + amount + 12) % 12; draw(); }
function drawLibrary() {
  document.getElementById('header').innerHTML =
    `<h1>Biblioteca</h1><button class="button primary" onclick="newFolder()">＋ Carpeta</button>`;
  if (currentFolder) return drawFolder();
  document.getElementById('app').innerHTML = `
    <p class="muted">Organiza tus canciones por evento: cumpleaños, bodas, celebraciones y más.</p>
    <div class="library-grid">
      ${data.folders.map(f => `
        <div class="card library-card" onclick="openFolder('${f.id}')">
          <div style="font-size:28px">📁</div><h3>${escapeHTML(f.name)}</h3>
          <small>${f.ids.length} canciones</small>
          <button class="button danger" onclick="event.stopPropagation();deleteFolder('${f.id}')">Eliminar carpeta</button>
        </div>`).join('')}
    </div>
    ${data.folders.length?'':'<div class="empty">Todavía no tienes carpetas. Crea una para un cumpleaños, una boda u otro evento.</div>'}`;
}
function newFolder() {
  const name = prompt('Nombre de la carpeta, por ejemplo: Cumpleaños o Bodas');
  if (!name || !name.trim()) return;
  data.folders.push({ id:id(), name:name.trim(), ids:[] }); save(); drawLibrary();
}
function openFolder(folderId) { currentFolder = folderId; drawFolder(); }
function drawFolder() {
  const f = data.folders.find(x => x.id === currentFolder);
  if (!f) { currentFolder = null; drawLibrary(); return; }
  document.getElementById('header').innerHTML =
    `<button class="button" onclick="currentFolder=null;drawLibrary()">←</button><h1>📁 ${escapeHTML(f.name)}</h1>`;
  const songs = f.ids.map(getSong).filter(Boolean);
  document.getElementById('app').innerHTML = `
    <div class="toolbar">
      <select id="add-song"><option value="">Agregar una canción…</option>
        ${data.songs.filter(s => !f.ids.includes(s.id)).map(s =>
          `<option value="${s.id}">${escapeHTML(s.title)}</option>`).join('')}
      </select>
      <button class="button primary" onclick="addToFolder()">Agregar</button>
      <button class="button" onclick="printFolder()">🖨️ Imprimir / PDF</button>
    </div>
    ${songs.map((s,i) => `<div class="song-item">
      <div class="info" onclick="openSong('${s.id}')"><b>${i+1}. ${escapeHTML(s.title)}</b><br><small>${escapeHTML(s.artist)}</small></div>
      <button class="button danger" onclick="removeFromFolder('${s.id}')">Quitar</button>
    </div>`).join('') || '<div class="empty">Agrega canciones a esta carpeta.</div>'}`;
}
function addToFolder() {
  const f = data.folders.find(x => x.id === currentFolder);
  const songId = document.getElementById('add-song').value;
  if (f && songId && !f.ids.includes(songId)) f.ids.push(songId);
  save(); drawFolder();
}
function removeFromFolder(songId) {
  const f = data.folders.find(x => x.id === currentFolder);
  if (f) f.ids = f.ids.filter(x => x !== songId);
  save(); drawFolder();
}
function deleteFolder(folderId) {
  if (!confirm('¿Eliminar esta carpeta? Las canciones no se borrarán.')) return;
  data.folders = data.folders.filter(f => f.id !== folderId); save(); drawLibrary();
}
function printFolder() {
  const f = data.folders.find(x => x.id === currentFolder);
  if (!f) return;
  const songs = f.ids.map(getSong).filter(Boolean);
  const original = document.getElementById('app').innerHTML;
  document.getElementById('app').innerHTML = `<h1>${escapeHTML(f.name)}</h1>` +
    songs.map(s => `<h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.artist)}</p>
      <div class="song">${renderSong(s.text,0)}</div><hr>`).join('');
  window.print();
  document.getElementById('app').innerHTML = original;
}
function drawSettings() {
  document.getElementById('header').innerHTML = '<h1>Ajustes</h1>';
  document.getElementById('app').innerHTML = `
    <div class="card">
      <label>Tema</label>
      <select onchange="data.theme=this.value;save();draw()">
        <option value="oscuro" ${data.theme==='oscuro'?'selected':''}>Oscuro</option>
        <option value="claro" ${data.theme==='claro'?'selected':''}>Claro</option>
        <option value="sepia" ${data.theme==='sepia'?'selected':''}>Sepia</option>
        <option value="bosque" ${data.theme==='bosque'?'selected':''}>Bosque</option>
      </select>
      <label>Fuente de lectura</label>
      <select onchange="data.font=this.value;save();draw()">
        <option value="mono" ${data.font==='mono'?'selected':''}>Monoespaciada, ideal para acordes</option>
        <option value="serif" ${data.font==='serif'?'selected':''}>Serif, estilo libro</option>
        <option value="sans" ${data.font==='sans'?'selected':''}>Sans serif, lectura sencilla</option>
      </select>
      <label>Columnas en pantalla grande</label>
      <select onchange="data.columns=Number(this.value);save();draw()">
        <option value="1" ${data.columns===1?'selected':''}>Una columna</option>
        <option value="2" ${data.columns===2?'selected':''}>Dos columnas</option>
        <option value="3" ${data.columns===3?'selected':''}>Tres columnas</option>
      </select>
      <label>Tamaño de letra: ${data.size}px</label>
      <input type="range" min="14" max="36" value="${data.size}"
        oninput="data.size=Number(this.value);setTheme();this.previousElementSibling.textContent='Tamaño de letra: '+data.size+'px'"
        onchange="save()">
    </div>
    <div class="card">
      <h3>Respaldo de canciones</h3>
      <p class="muted">Exporta un archivo para conservar tus canciones y carpetas. El respaldo se guarda en tu dispositivo.</p>
      <div class="toolbar">
        <button class="button primary" onclick="exportBackup()">⬇ Exportar respaldo</button>
        <label class="button" style="margin:0">⬆ Importar respaldo
          <input class="check" type="file" accept=".json,application/json" hidden onchange="importBackup(this.files[0])">
        </label>
      </div>
    </div>
    <div class="card">
      <h3>Acerca de tus datos</h3>
      <p class="muted">Las canciones se guardan en este navegador y en este dispositivo. No se sincronizan automáticamente con otros equipos. Guarda un respaldo periódicamente.</p>
    </div>`;
}
function exportBackup() {
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo-cancionero.json'; a.click();
  URL.revokeObjectURL(a.href);
}
function importBackup(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const incoming = JSON.parse(reader.result);
      if (!Array.isArray(incoming.songs) || !Array.isArray(incoming.folders)) throw new Error();
      if (!confirm('La importación reemplazará los datos actuales. ¿Continuar?')) return;
      data = {...data, ...incoming}; save(); draw();
      alert('Respaldo importado correctamente.');
    } catch (_) { alert('No se pudo leer el respaldo. Comprueba que sea un JSON válido del cancionero.'); }
  };
  reader.readAsText(file);
}

draw();
</script>
</body>
</html>
